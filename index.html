<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudo Depende</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #D4537E;
    --pink-light: #FBEAF0;
    --pink-dark: #72243E;
    --green: #639922;
    --green-light: #EAF3DE;
    --green-dark: #27500A;
    --purple: #7F77DD;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --amber-dark: #633806;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --teal-dark: #085041;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --coral-dark: #712B13;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #faf9f7;
    color: #1a1a1a;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCREENS */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* HOME */
  #home {
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 2.5rem;
  }

  .home-title {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: #1a1a1a;
  }

  .home-subtitle {
    font-size: 0.95rem;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .categories-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    width: 100%;
    max-width: 380px;
  }

  .cat-btn {
    border: none;
    border-radius: 16px;
    padding: 1.1rem 0.75rem;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    letter-spacing: 0.01em;
    line-height: 1.3;
    text-align: center;
  }

  .cat-btn:active { transform: scale(0.96); opacity: 0.85; }

  .cat-btn.all {
    grid-column: 1 / -1;
    background: #1a1a1a;
    color: #fff;
    font-size: 0.95rem;
    padding: 1.2rem;
    border-radius: 16px;
    letter-spacing: 0.02em;
  }

  .cat-btn[data-cat="relacionando"] { background: var(--pink-light); color: var(--pink-dark); }
  .cat-btn[data-cat="papo-furado"] { background: var(--green-light); color: var(--green-dark); }
  .cat-btn[data-cat="to-be"] { background: var(--purple-light); color: var(--purple-dark); }
  .cat-btn[data-cat="fanfiqueiros"] { background: var(--amber-light); color: var(--amber-dark); }
  .cat-btn[data-cat="cultura"] { background: var(--teal-light); color: var(--teal-dark); }
  .cat-btn[data-cat="pausa"] { background: var(--coral-light); color: var(--coral-dark); }

  /* GAME SCREEN */
  #game {
    padding: 0;
    position: relative;
  }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 1.25rem 0.75rem;
  }

  .back-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #888;
    padding: 0.25rem;
    line-height: 1;
  }

  .progress-info {
    font-size: 0.8rem;
    color: #aaa;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .cat-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 99px;
  }

  .cat-label[data-cat="relacionando"] { background: var(--pink-light); color: var(--pink-dark); }
  .cat-label[data-cat="papo-furado"] { background: var(--green-light); color: var(--green-dark); }
  .cat-label[data-cat="to-be"] { background: var(--purple-light); color: var(--purple-dark); }
  .cat-label[data-cat="fanfiqueiros"] { background: var(--amber-light); color: var(--amber-dark); }
  .cat-label[data-cat="cultura"] { background: var(--teal-light); color: var(--teal-dark); }
  .cat-label[data-cat="pausa"] { background: var(--coral-light); color: var(--coral-dark); }
  .cat-label[data-cat="all"] { background: #1a1a1a; color: #fff; }

  .card-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.25rem;
    perspective: 1000px;
  }

  .card {
    width: 100%;
    max-width: 340px;
    min-height: 380px;
    background: #fff;
    border-radius: 24px;
    border: 1px solid #eee;
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.5rem;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.25s, transform 0.25s;
  }

  .card.exit {
    opacity: 0;
    transform: translateY(-16px);
  }

  .card.enter {
    opacity: 0;
    transform: translateY(20px);
  }

  .card-option {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.3;
    color: #1a1a1a;
    letter-spacing: -0.02em;
  }

  .card-or {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
  }

  .card-or::before,
  .card-or::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #eee;
  }

  .or-bubble {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .game-footer {
    padding: 1rem 1.25rem 2rem;
    display: flex;
    gap: 0.75rem;
  }

  .nav-btn {
    flex: 1;
    padding: 1rem;
    border-radius: 14px;
    border: 1px solid #e5e5e5;
    background: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #1a1a1a;
    transition: transform 0.12s, background 0.12s;
    letter-spacing: 0.01em;
  }

  .nav-btn:active { transform: scale(0.97); background: #f5f5f5; }

  .nav-btn.primary {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
    flex: 2;
  }

  .nav-btn.primary:active { background: #333; }

  /* EMPTY */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem;
    text-align: center;
    color: #888;
  }

  .empty-state .big { font-size: 3rem; }
  .empty-state h2 { font-size: 1.2rem; font-weight: 600; color: #1a1a1a; }
  .empty-state p { font-size: 0.9rem; line-height: 1.5; }

  .progress-bar {
    height: 3px;
    background: #eee;
    margin: 0 1.25rem;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: #1a1a1a;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">

  </div>

<!-- GAME -->
<div id="game" class="screen">

      </div>

  </div>
  <div class="game-footer">
    <button class="nav-btn" onclick="prevCard()">← Anterior</button>
    <button class="nav-btn primary" onclick="nextCard()">Próxima →</button>
  </div>
</div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    let all = [];
    Object.entries(QUESTIONS).forEach(([key, qs]) => {
      qs.forEach(q => all.push({ q, cat: key }));
    });
    deck = shuffle(all);
  } else {
    deck = shuffle(QUESTIONS[cat].map(q => ({ q, cat })));
  }
  currentIndex = 0;
  showScreen("game");

  const label = document.getElementById("game-cat-label");
  label.textContent = CAT_NAMES[cat];
  label.setAttribute("data-cat", cat === "all" ? "all" : cat);

  renderCard(false);
}

function renderCard(animate) {
  const card = document.getElementById("card");
  const item = deck[currentIndex];

  if (animate) {
    card.classList.add("exit");
    setTimeout(() => {
      updateCardContent(item);
      card.classList.remove("exit");
      card.classList.add("enter");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.classList.remove("enter");
        });
      });
    }, 220);
  } else {
    updateCardContent(item);
  }

  const total = deck.length;
  document.getElementById("progress-text").textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById("progress-fill").style.width = `${((currentIndex + 1) / total) * 100}%`;

  if (currentCat === "all") {
    const label = document.getElementById("game-cat-label");
    label.textContent = CAT_NAMES[item.cat];
    label.setAttribute("data-cat", item.cat);
  }
}

function updateCardContent(item) {
  document.getElementById("option-a").textContent = item.q[0];
  document.getElementById("option-b").textContent = item.q[1];
}

function nextCard() {
  if (currentIndex < deck.length - 1) {
    currentIndex++;
    renderCard(true);
  } else {
    showEndState();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard(true);
  }
}

function showEndState() {
  const cardArea = document.querySelector(".card-area");
  cardArea.innerHTML = `
    <div class="empty-state">
      <div class="big">✓</div>
      <h2>Acabou por aqui!</h2>
      <p>Vocês passaram por todas as cartas.<br>Querem embaralhar de novo?</p>
      <button class="nav-btn primary" style="margin-top:1rem; max-width: 200px;" onclick="startGame(currentCat)">Embaralhar de novo</button>
    </div>
  `;
}

function goHome() {
  showScreen("home");
  const cardArea = document.querySelector(".card-area");
  cardArea.innerHTML = `<div class="card" id="card">
    <div class="card-option" id="option-a"></div>
    <div class="card-or"><div class="or-bubble">ou</div></div>
    <div class="card-option" id="option-b"></div>
  </div>`;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>
</body>
</html>
