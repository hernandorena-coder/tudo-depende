<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudo Depende</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0eb;
  --text: #1a1a1a;
  --muted: rgba(0,0,0,0.38);
  --border: rgba(0,0,0,0.1);
  --card-bg: rgba(255,255,255,0.88);
  --transition: 0.55s cubic-bezier(0.4,0,0.2,1);
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background var(--transition);
}

body.cat-relacionando { --bg: #f0cdd8; }
body.cat-papo-furado  { --bg: #c8e6cf; }
body.cat-to-be        { --bg: #d9d4f5; }
body.cat-fanfiqueiros  { --bg: #fde3bb; }
body.cat-cultura      { --bg: #bfe0d8; }
body.cat-pausa        { --bg: #f5d8cc; }
body.cat-all          { --bg: #f5f0eb; }

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ── DECORATIVE BLOBS ── */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
  transition: background var(--transition), opacity var(--transition);
}
.blob-1 { width: 280px; height: 280px; top: -80px; right: -60px; background: rgba(0,0,0,0.06); }
.blob-2 { width: 200px; height: 200px; bottom: 60px; left: -60px; background: rgba(0,0,0,0.05); }

body.cat-relacionando .blob-1 { background: #e8a0b8; opacity: 0.5; }
body.cat-relacionando .blob-2 { background: #c97090; opacity: 0.35; }
body.cat-papo-furado  .blob-1 { background: #80c990; opacity: 0.5; }
body.cat-papo-furado  .blob-2 { background: #50a060; opacity: 0.35; }
body.cat-to-be        .blob-1 { background: #a090e0; opacity: 0.5; }
body.cat-to-be        .blob-2 { background: #7060c0; opacity: 0.35; }
body.cat-fanfiqueiros  .blob-1 { background: #f0b060; opacity: 0.5; }
body.cat-fanfiqueiros  .blob-2 { background: #d08030; opacity: 0.35; }
body.cat-cultura      .blob-1 { background: #60c0a8; opacity: 0.5; }
body.cat-cultura      .blob-2 { background: #309070; opacity: 0.35; }
body.cat-pausa        .blob-1 { background: #e09880; opacity: 0.5; }
body.cat-pausa        .blob-2 { background: #c06840; opacity: 0.35; }

/* ── HOME ── */
#home {
  padding: 3rem 1.5rem 2.5rem;
  align-items: center;
  gap: 2.5rem;
  position: relative;
  z-index: 1;
}

#home .home-header,
#home .categories-wrap {
  position: relative;
  z-index: 2;
}

.home-header { text-align: center; }

.home-tag {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.6rem;
}

.home-title {
  font-family: 'Playfair Display', serif;
  font-size: 4.2rem;
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.03em;
  color: var(--text);
}

.home-subtitle {
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.9rem;
}

.home-divider {
  width: 32px;
  height: 2px;
  background: var(--text);
  opacity: 0.15;
  border-radius: 99px;
  margin: 0 auto;
  margin-top: 1.5rem;
}

/* ── CATEGORY GRID ── */
.categories-wrap { width: 100%; max-width: 380px; }

.cat-section-label {
  font-size: 0.67rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.75rem;
  text-align: center;
}

.cat-btn-all {
  width: 100%;
  background: var(--text);
  color: #fff;
  border: none;
  border-radius: 18px;
  padding: 1.15rem 1.5rem;
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 0.9rem;
  transition: opacity 0.15s, transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  letter-spacing: -0.01em;
}

.cat-btn-all:active { transform: scale(0.97); opacity: 0.85; }

.categories-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}

.cat-btn {
  border: none;
  border-radius: 16px;
  padding: 1rem 0.85rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  text-align: center;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}

.cat-btn:active { transform: scale(0.95); opacity: 0.8; }

.cat-btn .cat-emoji { font-size: 1.4rem; }
.cat-btn .cat-name { font-size: 0.75rem; font-weight: 600; }

.cat-btn[data-cat="relacionando"] { background: #fce8ef; color: #7a2040; }
.cat-btn[data-cat="papo-furado"]  { background: #dff0e3; color: #1a5c30; }
.cat-btn[data-cat="to-be"]        { background: #e8e4f8; color: #3a2f8f; }
.cat-btn[data-cat="fanfiqueiros"]  { background: #fef0d8; color: #7a4800; }
.cat-btn[data-cat="cultura"]      { background: #d8eeea; color: #0a5040; }
.cat-btn[data-cat="pausa"]        { background: #fde8e0; color: #7a2e10; }

/* ── GAME ── */
#game { position: relative; z-index: 1; }

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem 0;
}

.back-btn {
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 10px;
  width: 38px; height: 38px;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  transition: background 0.15s;
}
.back-btn:hover { background: rgba(255,255,255,0.85); }

.game-cat-pill {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.35rem 0.9rem;
  border-radius: 99px;
  background: rgba(255,255,255,0.6);
  color: var(--text);
  border: 1px solid rgba(0,0,0,0.1);
  backdrop-filter: blur(8px);
}

.progress-info {
  font-size: 0.73rem;
  font-weight: 500;
  color: var(--muted);
  min-width: 40px;
  text-align: right;
}

.progress-bar {
  height: 2px;
  background: rgba(0,0,0,0.08);
  margin: 1rem 1.5rem 0;
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--text);
  transition: width 0.4s ease;
}

.card-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

.card {
  width: 100%;
  max-width: 360px;
  background: var(--card-bg);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.9);
  padding: 2.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  backdrop-filter: blur(16px);
  box-shadow: 0 8px 48px rgba(0,0,0,0.07);
  opacity: 1;
  transform: translateY(0) scale(1);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.card.exit { opacity: 0; transform: translateY(-14px) scale(0.97); }
.card.enter { opacity: 0; transform: translateY(16px) scale(0.97); }

.card-option {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text);
  letter-spacing: -0.02em;
  text-align: center;
}

/* ── HOME DECORATIVE ELEMENTS ── */
.home-deco {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  color: var(--text);
  opacity: 0.055;
  user-select: none;
  transition: opacity var(--transition);
}
.home-deco.d1  { top: 5%;  left: 7%;   font-size: 2rem;   opacity: 0.07; }
.home-deco.d2  { top: 11%; right: 9%;  font-size: 1.2rem; opacity: 0.045; }
.home-deco.d3  { top: 30%; left: 4%;   font-size: 1rem;   opacity: 0.04; }
.home-deco.d4  { top: 20%; right: 5%;  font-size: 1.8rem; opacity: 0.055; }
.home-deco.d5  { bottom: 30%; left: 6%;  font-size: 1.4rem; opacity: 0.05; }
.home-deco.d6  { bottom: 18%; right: 7%; font-size: 1rem;   opacity: 0.04; }
.home-deco.d7  { bottom: 9%;  left: 13%; font-size: 1.6rem; opacity: 0.055; }

.card-or {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.card-or::before, .card-or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(0,0,0,0.08);
}

.or-bubble {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #1a1a1a;
  color: #fff;
  font-family: 'Playfair Display', serif;
  font-size: 0.8rem;
  font-weight: 700;
  font-style: italic;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  letter-spacing: 0.01em;
}

.game-footer {
  padding: 0 1.5rem 2.5rem;
  display: flex;
  gap: 0.75rem;
}

.nav-btn {
  flex: 1;
  padding: 1rem;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.13);
  background: rgba(255,255,255,0.55);
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  transition: transform 0.12s, background 0.12s;
  backdrop-filter: blur(8px);
}

.nav-btn:active { transform: scale(0.97); }
.nav-btn:hover { background: rgba(255,255,255,0.82); }

.nav-btn.primary {
  background: var(--text);
  color: #fff;
  border-color: transparent;
  flex: 2;
}
.nav-btn.primary:hover { opacity: 0.88; background: var(--text); }

.empty-state {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.85rem; padding: 2rem; text-align: center;
}

.empty-icon {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem; font-weight: 900;
  color: var(--muted); line-height: 1;
}

.empty-state h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--text);
}

.empty-state p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body class="cat-all">

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-header">
    <div class="home-tag">Jogo de perguntas</div>
    <div class="home-title">Tudo<br>Depende</div>
    <div class="home-subtitle">da sua opinião</div>
    <div class="home-divider"></div>
  </div>

  <div class="categories-wrap">
    <div class="cat-section-label">Escolha uma categoria</div>
    <button class="cat-btn-all" onclick="startGame('all')">
      Embaralhar tudo ✦
    </button>
    <div class="categories-grid">
      <button class="cat-btn" data-cat="relacionando" onclick="startGame('relacionando')">
        <span class="cat-emoji">❤️</span>
        <span class="cat-name">Relacionando</span>
      </button>
      <button class="cat-btn" data-cat="papo-furado" onclick="startGame('papo-furado')">
        <span class="cat-emoji">🤪</span>
        <span class="cat-name">Papo Furado</span>
      </button>
      <button class="cat-btn" data-cat="to-be" onclick="startGame('to-be')">
        <span class="cat-emoji">🤔</span>
        <span class="cat-name">To be or Not to Be</span>
      </button>
      <button class="cat-btn" data-cat="fanfiqueiros" onclick="startGame('fanfiqueiros')">
        <span class="cat-emoji">🎭</span>
        <span class="cat-name">Fanfiqueiros</span>
      </button>
      <button class="cat-btn" data-cat="cultura" onclick="startGame('cultura')">
        <span class="cat-emoji">🎓</span>
        <span class="cat-name">Cultura (in)útil</span>
      </button>
      <button class="cat-btn" data-cat="pausa" onclick="startGame('pausa')">
        <span class="cat-emoji">🌙</span>
        <span class="cat-name">Pausa Existencial</span>
      </button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="game-cat-pill" id="game-cat-label"></div>
    <span class="progress-info" id="progress-text"></span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="card-area">
    <div class="card" id="card">
      <div class="card-option" id="option-a"></div>
      <div class="card-or"><div class="or-bubble">ou</div></div>
      <div class="card-option" id="option-b"></div>
    </div>
  </div>
  <div class="game-footer">
    <button class="nav-btn" onclick="prevCard()">← Anterior</button>
    <button class="nav-btn primary" onclick="nextCard()">Próxima →</button>
  </div>
</div>

const CAT_NAMES = {
  all: "Tudo Depende",
  relacionando: "❤️ Relacionando",
  "papo-furado": "🤪 Papo Furado",
  "to-be": "🤔 To be or Not to Be",
  fanfiqueiros: "🎭 Fanfiqueiros",
  cultura: "🎓 Cultura (in)útil",
  pausa: "🌙 Pausa Existencial"
};

let deck = [], currentIndex = 0, currentCat = "all";

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setBgClass(cat) {
  document.body.className = "cat-" + (cat === "all" ? "all" : cat);
}

function startGame(cat) {
  currentCat = cat;
  if (cat === "all") {
    let all = [];
    Object.entries(QUESTIONS).forEach(function(entry) {
      entry[1].forEach(function(q) { all.push({ q: q, cat: entry[0] }); });
    });
    deck = shuffle(all);
  } else {
    deck = shuffle(QUESTIONS[cat].map(function(q) { return { q: q, cat: cat }; }));
  }
  currentIndex = 0;
  setBgClass(cat);
  showScreen("game");
  document.getElementById("game-cat-label").textContent = CAT_NAMES[cat];
  renderCard(false);
}

function renderCard(animate) {
  const item = deck[currentIndex];
  if (currentCat === "all") {
    setBgClass(item.cat);
    document.getElementById("game-cat-label").textContent = CAT_NAMES[item.cat];
  }
  const total = deck.length;
  document.getElementById("progress-text").textContent = (currentIndex + 1) + " / " + total;
  document.getElementById("progress-fill").style.width = (((currentIndex + 1) / total) * 100) + "%";

  const card = document.getElementById("card");
  if (animate) {
    card.classList.add("exit");
    setTimeout(function() {
      updateCardContent(item);
      card.classList.remove("exit");
      card.classList.add("enter");
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { card.classList.remove("enter"); });
      });
    }, 200);
  } else {
    updateCardContent(item);
  }
}

function updateCardContent(item) {
  document.getElementById("option-a").textContent = item.q[0];
  document.getElementById("option-b").textContent = item.q[1];
}

function nextCard() {
  if (currentIndex < deck.length - 1) {
    currentIndex++;
    renderCard(true);
  } else {
    showEndState();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard(true);
  }
}

function showEndState() {
  document.querySelector(".card-area").innerHTML =
    '<div class="empty-state">' +
    '<div class="empty-icon">fim.</div>' +
    '<h2>Acabou por aqui!</h2>' +
    '<p>Vocês passaram por todas as cartas.<br>Querem embaralhar de novo?</p>' +
    '<button class="nav-btn primary" style="margin-top:1.5rem;max-width:220px" onclick="startGame(currentCat)">Embaralhar de novo</button>' +
    '</div>';
  document.querySelector(".game-footer").style.display = "none";
}

function goHome() {
  setBgClass("all");
  showScreen("home");
  document.querySelector(".game-footer").style.display = "";
  document.querySelector(".card-area").innerHTML =
    '<div class="card" id="card">' +
    '<div class="card-option" id="option-a"></div>' +
    '<div class="card-or"><div class="or-bubble">ou</div></div>' +
    '<div class="card-option" id="option-b"></div>' +
    '</div>';
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}
</script>
